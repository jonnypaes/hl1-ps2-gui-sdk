name: Package Extension
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ./*.vsix
